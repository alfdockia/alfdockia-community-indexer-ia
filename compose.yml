services:
  alfdockia-community-indexer-ia:
    image: alfdockia-community-indexer-ia:1.0.0
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAR_FILE: ${JAR_FILE:-target/alfdockia-community-indexer-ia-1.0.0.jar}
    environment:
      JAVA_OPTS: ${JAVA_OPTS:-}

      SPRING_APPLICATION_NAME: ${SPRING_APPLICATION_NAME:-alfdockia-community-indexer-ia}
      SPRING_MAIN_BANNER_MODE: ${SPRING_MAIN_BANNER_MODE:-off}
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK:-ERROR}
      LOGGING_LEVEL_ALFDOCKIA_COMMUNITY_INDEXER_IA: ${LOGGING_LEVEL_ALFDOCKIA_COMMUNITY_INDEXER_IA:-INFO}
      LOGGING_PATTERN_CONSOLE: ${LOGGING_PATTERN_CONSOLE}

      SERVER_PORT: ${SERVER_PORT:-8082}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:-health,info,prometheus}
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: ${MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED:-true}

      SPRING_ACTIVEMQ_BROKER_URL: ${SPRING_ACTIVEMQ_BROKER_URL:-tcp://host.docker.internal:61616}
      SPRING_JMS_CACHE_ENABLED: ${SPRING_JMS_CACHE_ENABLED:-false}
      ALFRESCO_EVENTS_ENABLE_SPRING_INTEGRATION: ${ALFRESCO_EVENTS_ENABLE_SPRING_INTEGRATION:-false}
      ALFRESCO_EVENTS_ENABLE_HANDLERS: ${ALFRESCO_EVENTS_ENABLE_HANDLERS:-true}
      INDEXER_EVENTS_COALESCE_MS: ${INDEXER_EVENTS_COALESCE_MS:-2000}
      SPRING_TASK_SCHEDULING_POOL_SIZE: ${SPRING_TASK_SCHEDULING_POOL_SIZE:-4}

      ALFRESCO_ACS_HOST: ${ALFRESCO_ACS_HOST:-http://host.docker.internal:8080}
      ALFRESCO_ACS_USER: ${ALFRESCO_ACS_USER:-admin}
      ALFRESCO_ACS_PASSWORD: ${ALFRESCO_ACS_PASSWORD:-admin}
      ALFRESCO_ACS_API_PATH: ${ALFRESCO_ACS_API_PATH:-/alfresco/api/-default-/public/alfresco/versions/1}
      ALFRESCO_CONTENT_INCLUDE: ${ALFRESCO_CONTENT_INCLUDE:-path,permissions,properties,aspectNames}
      ALFRESCO_CONTENT_DOWNLOAD: ${ALFRESCO_CONTENT_DOWNLOAD:-true}
      ALFRESCO_CONTENT_ALLOWED_NODE_TYPES: ${ALFRESCO_CONTENT_ALLOWED_NODE_TYPES:-cm:content}
      ALFRESCO_CONTENT_ALLOWED_MIME_TYPES: ${ALFRESCO_CONTENT_ALLOWED_MIME_TYPES:-application/pdf}
      ALFRESCO_CONTENT_DESCENDANT_PERMISSIONS_REINDEX: ${ALFRESCO_CONTENT_DESCENDANT_PERMISSIONS_REINDEX:-false}
      ALFRESCO_CONTENT_DESCENDANT_PERMISSIONS_MAX_DEPTH: ${ALFRESCO_CONTENT_DESCENDANT_PERMISSIONS_MAX_DEPTH:-20}
      ALFRESCO_CONTENT_DESCENDANT_PERMISSIONS_PAGE_SIZE: ${ALFRESCO_CONTENT_DESCENDANT_PERMISSIONS_PAGE_SIZE:-100}

      CONTENT_EXTRACTION_WRITE_LIMIT: ${CONTENT_EXTRACTION_WRITE_LIMIT:--1}
      CONTENT_EXTRACTION_MAX_BYTES: ${CONTENT_EXTRACTION_MAX_BYTES:-52428800}

      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_API_ORGANIZATION: ${OPENAI_API_ORGANIZATION:-}
      OPENAI_API_PROJECT: ${OPENAI_API_PROJECT:-}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-https://api.openai.com}
      OPENAI_EMBEDDINGS_PATH: ${OPENAI_EMBEDDINGS_PATH:-/v1/embeddings}
      OPENAI_EMBEDDINGS_MODEL: ${OPENAI_EMBEDDINGS_MODEL:-text-embedding-3-small}
      OPENAI_EMBEDDINGS_DIMENSIONS: ${OPENAI_EMBEDDINGS_DIMENSIONS:-}
      OPENAI_EMBEDDINGS_ENCODING_FORMAT: ${OPENAI_EMBEDDINGS_ENCODING_FORMAT:-float}
      EMBEDDING_VECTOR_DIMENSION: ${EMBEDDING_VECTOR_DIMENSION:-1536}
      EMBEDDING_VECTOR_MISSING_STRATEGY: ${EMBEDDING_VECTOR_MISSING_STRATEGY:-skip}

      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-alfresco-content}
      QDRANT_COLLECTION_CREATE: ${QDRANT_COLLECTION_CREATE:-true}
      QDRANT_COLLECTION_WAIT: ${QDRANT_COLLECTION_WAIT:-true}
      QDRANT_COLLECTION_DISTANCE: ${QDRANT_COLLECTION_DISTANCE:-Cosine}
      QDRANT_COLLECTION_VECTORS_ON_DISK: ${QDRANT_COLLECTION_VECTORS_ON_DISK:-true}
      QDRANT_PAYLOAD_INDEXES_CREATE: ${QDRANT_PAYLOAD_INDEXES_CREATE:-true}
      QDRANT_PAYLOAD_DYNAMIC_INDEXES_ENABLED: ${QDRANT_PAYLOAD_DYNAMIC_INDEXES_ENABLED:-false}
      QDRANT_PAYLOAD_DYNAMIC_INDEXES_INCLUDE_NAMESPACES: ${QDRANT_PAYLOAD_DYNAMIC_INDEXES_INCLUDE_NAMESPACES:-}
      QDRANT_PAYLOAD_DYNAMIC_INDEXES_EXCLUDE_NAMESPACES: ${QDRANT_PAYLOAD_DYNAMIC_INDEXES_EXCLUDE_NAMESPACES:-sys,rn,ver,act}
      QDRANT_PAYLOAD_DYNAMIC_INDEXES_REFRESH_MS: ${QDRANT_PAYLOAD_DYNAMIC_INDEXES_REFRESH_MS:-3600000}
      QDRANT_PAYLOAD_STORE_CONTENT_TEXT: ${QDRANT_PAYLOAD_STORE_CONTENT_TEXT:-true}
      QDRANT_PAYLOAD_MAX_CONTENT_TEXT_LENGTH: ${QDRANT_PAYLOAD_MAX_CONTENT_TEXT_LENGTH:--1}
      QDRANT_HTTP_CONNECT_TIMEOUT_MS: ${QDRANT_HTTP_CONNECT_TIMEOUT_MS:-5000}
      QDRANT_HTTP_READ_TIMEOUT_MS: ${QDRANT_HTTP_READ_TIMEOUT_MS:-120000}

      INDEXER_ADMIN_API_KEY: ${INDEXER_ADMIN_API_KEY:-}
      INDEXER_ADMIN_API_KEY_HEADER: ${INDEXER_ADMIN_API_KEY_HEADER:-X-Indexer-Admin-Key}
    ports:
      - "${ALFDOCKIA_INDEXER_PORT:-8082}:${SERVER_PORT:-8082}"
    depends_on:
      - qdrant

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.19.0}
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  qdrant-data:
