spring.application.name=alfdockia-community-indexer-ia
spring.main.banner-mode=off

logging.level.org.springframework=ERROR
logging.level.alfdockia.community.indexer.ia=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

server.port=8082
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

spring.activemq.broker-url=tcp://localhost:61616
spring.jms.cache.enabled=false
alfresco.events.enableSpringIntegration=false
alfresco.events.enableHandlers=true
indexer.events.coalesce-ms=2000
spring.task.scheduling.pool.size=4

alfresco.acs.host=http://localhost:8080
alfresco.acs.user=admin
alfresco.acs.password=admin
alfresco.acs.api.path=/alfresco/api/-default-/public/alfresco/versions/1
alfresco.content.include=path,permissions,properties,aspectNames
alfresco.content.download=true
alfresco.content.allowed-node-types=cm:content
alfresco.content.allowed-mime-types=application/pdf
alfresco.content.descendant-permissions.reindex=false
alfresco.content.descendant-permissions.max-depth=20
alfresco.content.descendant-permissions.page-size=100
alfresco.dictionary.path=/alfresco/s/api/classes

content.extraction.write-limit=-1
content.extraction.max-bytes=52428800

openai.api.key=
openai.api.organization=
openai.api.project=
openai.api.base-url=https://api.openai.com
openai.embeddings.path=/v1/embeddings
openai.embeddings.model=text-embedding-3-small
openai.embeddings.dimensions=
openai.embeddings.encoding-format=float

embedding.vector.dimension=1536
embedding.vector.missing-strategy=skip

qdrant.url=http://localhost:6333
qdrant.api-key=
qdrant.collection.name=alfresco-content
qdrant.collection.create=true
qdrant.collection.wait=true
qdrant.collection.distance=Cosine
qdrant.collection.vectors-on-disk=true
qdrant.vector.dense.name=dense
qdrant.vector.sparse.name=bm25
qdrant.payload.indexes.create=true
qdrant.payload.dynamic-indexes.enabled=false
qdrant.payload.dynamic-indexes.include-namespaces=
qdrant.payload.dynamic-indexes.exclude-namespaces=sys,rn,ver,act
qdrant.payload.dynamic-indexes.refresh-ms=3600000
qdrant.payload.store-content-text=true
qdrant.payload.max-content-text-length=-1
qdrant.http.connect-timeout-ms=5000
qdrant.http.read-timeout-ms=120000

indexer.admin.api-key=
indexer.admin.api-key-header=X-Indexer-Admin-Key
